# Painel de edição (Decap CMS) — MODO DEMONSTRAÇÃO.
# As alterações feitas aqui ficam só no navegador (não são publicadas). Serve para mostrar como o cliente edita o site.
#
# PARA PUBLICAR DE VERDADE: apague o bloco "test-repo" abaixo e descomente o bloco "github".
# Cada salvar vira um commit no repositório e a Vercel publica sozinha. O cliente precisa de uma conta no GitHub com acesso ao repositório
# e de um serviço de login OAuth (veja o README, seção "Ativar a edição real").
backend:
  name: test-repo
# backend:
#   name: github
#   repo: kelvisrodriguesgt-source/sites-vitrine
#   branch: main

locale: pt
site_url: /
display_url: /
logo_url: /favicon.svg
media_folder: celeste-odontologia/public/img
public_folder: /img
publish_mode: simple

collections:
  - name: conteudo
    label: "Conteúdo do site"
    files:
      - label: "Dados da clínica"
        name: info
        file: celeste-odontologia/src/content/info.json
        format: json
        fields:
          - label: "Marca"
            name: brand
            widget: object
            fields:
              - label: "Nome"
                name: name
                widget: string
              - label: "Segmento (linha sob o logo)"
                name: segment
                widget: string
              - label: "Frase da marca"
                name: tagline
                widget: string
              - label: "Site demonstrativo"
                name: demo
                widget: boolean
              - label: "Aviso de demonstração"
                name: demoNote
                widget: string
          - label: "Contato"
            name: contact
            widget: object
            fields:
              - label: "WhatsApp (só números, com 55 e DDD)"
                name: whatsapp
                widget: string
              - label: "WhatsApp (como aparece)"
                name: whatsappDisplay
                widget: string
              - label: "Telefone (como aparece)"
                name: phone
                widget: string
              - label: "Telefone (formato +55...)"
                name: phoneTel
                widget: string
              - label: "Instagram (@usuario)"
                name: instagramHandle
                widget: string
              - label: "Link do Instagram"
                name: instagramUrl
                widget: string
              - label: "Mensagem do botão de agendar"
                name: greeting
                widget: string
              - label: "Mensagem por tratamento (use {tratamento})"
                name: treatmentGreeting
                widget: string
          - label: "Endereço"
            name: address
            widget: object
            fields:
              - label: "Rua e número"
                name: street
                widget: string
              - label: "Bairro"
                name: district
                widget: string
              - label: "Cidade"
                name: city
                widget: string
              - label: "UF"
                name: state
                widget: string
              - label: "CEP"
                name: postalCode
                widget: string
              - label: "Mapa: link de incorporação do Google Maps (vazio = sem mapa)"
                name: mapEmbedSrc
                widget: string
                required: false
              - label: "Link do botão Como chegar (vazio = busca pelo endereço)"
                name: directionsUrl
                widget: string
                required: false
          - label: "Horários"
            name: hours
            widget: list
            fields:
              - label: "Dias (rótulo)"
                name: label
                widget: string
              - label: "Horário (texto)"
                name: time
                widget: string
              - label: "Dias em inglês para o Google (ex.: Monday,Tuesday)"
                name: days
                widget: string
                required: false
              - label: "Abre (HH:MM)"
                name: opens
                widget: string
                required: false
              - label: "Fecha (HH:MM)"
                name: closes
                widget: string
                required: false
          - label: "Fotos"
            name: images
            widget: object
            fields:
              - label: "Topo (desktop)"
                name: hero
                widget: image
              - label: "Topo: descrição"
                name: heroAlt
                widget: string
              - label: "Topo (celular)"
                name: heroMobile
                widget: image
              - label: "Recepção"
                name: reception
                widget: image
              - label: "Recepção: descrição"
                name: receptionAlt
                widget: string
              - label: "Consultório"
                name: clinicRoom
                widget: image
              - label: "Consultório: descrição"
                name: clinicRoomAlt
                widget: string
              - label: "Tecnologia"
                name: technology
                widget: image
              - label: "Tecnologia: descrição"
                name: technologyAlt
                widget: string
              - label: "Chamada final"
                name: ctaFinal
                widget: image
      - label: "Textos do site"
        name: texts
        file: celeste-odontologia/src/content/texts.json
        format: json
        fields:
          - label: "Cabeçalho"
            name: header
            widget: object
            fields:
              - label: "Botão"
                name: cta
                widget: string
          - label: "Topo"
            name: hero
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
              - label: "Título para leitores de tela e Google"
                name: srTitle
                widget: string
              - label: "Subtítulo"
                name: subtitle
                widget: string
              - label: "Botão principal"
                name: primary
                widget: string
              - label: "Botão secundário"
                name: secondary
                widget: string
              - label: "Balão"
                name: bubble
                widget: string
              - label: "Rótulo do vídeo"
                name: videoLabel
                widget: string
              - label: "Texto do vídeo"
                name: videoPlaceholder
                widget: string
          - label: "Tratamentos"
            name: treatments
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
              - label: "Subtítulo"
                name: subtitle
                widget: string
              - label: "Link \"todos os tratamentos\""
                name: allCta
                widget: string
              - label: "Prefixo do botão do cartão"
                name: cardCta
                widget: string
          - label: "A clínica"
            name: clinic
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
              - label: "Frase em destaque"
                name: quote
                widget: string
              - label: "Legenda da foto"
                name: roomCaption
                widget: string
          - label: "Números"
            name: highlights
            widget: object
            fields:
              - label: "Título do cartão"
                name: ctaTitle
                widget: string
              - label: "Texto do cartão"
                name: ctaText
                widget: string
              - label: "Botão do cartão"
                name: ctaButton
                widget: string
          - label: "Tecnologia"
            name: technology
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
              - label: "Subtítulo"
                name: subtitle
                widget: string
          - label: "Equipe"
            name: team
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
              - label: "Subtítulo"
                name: subtitle
                widget: string
          - label: "Como funciona"
            name: steps
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
          - label: "Dúvidas"
            name: faq
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
          - label: "Contato"
            name: contact
            widget: object
            fields:
              - label: "Linha pequena"
                name: eyebrow
                widget: string
              - label: "Título (use *itálico*)"
                name: title
                widget: string
              - label: "Subtítulo"
                name: subtitle
                widget: string
              - label: "Texto do espaço do mapa"
                name: mapPlaceholder
                widget: string
          - label: "Chamada final"
            name: finalCta
            widget: object
            fields:
              - label: "Título (use *itálico*)"
                name: title
                widget: string
              - label: "Texto"
                name: text
                widget: string
              - label: "Botão"
                name: button
                widget: string
          - label: "Resumo para o Google e assistentes (llms.txt)"
            name: seoIntro
            widget: text
      - label: "Tratamentos"
        name: treatments
        file: celeste-odontologia/src/content/treatments.json
        format: json
        fields:
          - label: "Tratamentos"
            name: treatments
            widget: list
            fields:
              - label: "Identificador (sem espaços)"
                name: id
                widget: string
              - label: "Título"
                name: title
                widget: string
              - label: "Itens (3)"
                name: items
                widget: list
                min: 3
                max: 3
                field:
                  label: "Item"
                  name: item
                  widget: string
              - label: "Foto"
                name: image
                widget: image
              - label: "Descrição da foto"
                name: imageAlt
                widget: string
      - label: "Diferenciais, números e tecnologia"
        name: differentials
        file: celeste-odontologia/src/content/differentials.json
        format: json
        fields:
          - label: "Diferenciais (seção A clínica)"
            name: differentials
            widget: list
            fields:
              - label: "Ícone (cpu, users, heart, shield, sparkles, award, stethoscope)"
                name: icon
                widget: string
              - label: "Título"
                name: title
                widget: string
              - label: "Texto"
                name: text
                widget: text
          - label: "Números em destaque (usar só dado real do cliente)"
            name: highlights
            widget: list
            fields:
              - label: "Valor"
                name: value
                widget: string
              - label: "Descrição"
                name: label
                widget: string
          - label: "Tecnologia"
            name: technology
            widget: list
            fields:
              - label: "Identificador"
                name: id
                widget: string
              - label: "Ícone (scan, xray, smile, cpu)"
                name: icon
                widget: string
              - label: "Título"
                name: title
                widget: string
              - label: "Texto"
                name: text
                widget: text
          - label: "Como funciona"
            name: steps
            widget: list
            fields:
              - label: "Título"
                name: title
                widget: string
              - label: "Texto"
                name: text
                widget: text
      - label: "Equipe"
        name: team
        file: celeste-odontologia/src/content/team.json
        format: json
        fields:
          - label: "Profissionais"
            name: team
            widget: list
            fields:
              - label: "Nome"
                name: name
                widget: string
              - label: "Especialidade"
                name: specialty
                widget: string
              - label: "CRO (só se confirmado; vazio = não aparece)"
                name: cro
                widget: string
                required: false
              - label: "Apresentação curta"
                name: bio
                widget: text
                required: false
      - label: "Perguntas frequentes"
        name: faq
        file: celeste-odontologia/src/content/faq.json
        format: json
        fields:
          - label: "Perguntas"
            name: faq
            widget: list
            fields:
              - label: "Pergunta"
                name: q
                widget: string
              - label: "Resposta"
                name: a
                widget: text
