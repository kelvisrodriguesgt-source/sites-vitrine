# Painel de edição (Decap CMS) do Brasa Burger.
#
# MODO DEMONSTRAÇÃO (atual): "test-repo" guarda tudo só na memória do navegador. Dá para mexer em tudo e ver
# como funciona, mas NADA é salvo no site; ao recarregar a página, volta ao conteúdo atual.
#
# MODO REAL: trocar o bloco "backend" pelo comentado abaixo. Cada "Publicar" vira um commit no GitHub
# e o site é atualizado pela Vercel. Exige um aplicativo OAuth do GitHub (veja o README, seção "Painel").
backend:
  name: test-repo
# backend:
#   name: github
#   repo: kelvisrodriguesgt-source/sites-vitrine
#   branch: main
#   base_url: https://URL-DO-SERVIDOR-OAUTH
#   auth_endpoint: api/auth

locale: pt
publish_mode: simple
show_preview_links: false
media_folder: brasa-burger/public/img
public_folder: /img
logo_url: /favicon.svg

collections:
  - name: cardapio
    label: Cardápio
    delete: false
    editor:
      preview: false
    files:
      - name: produtos
        label: Produtos e preços
        file: brasa-burger/src/content/products.json
        fields:
          - label: Produtos
            label_singular: Produto
            name: products
            widget: list
            collapsed: true
            summary: "{{fields.name}} - R$ {{fields.price}}"
            fields:
              - { label: "Código (gerado automaticamente)", name: id, widget: uuid, prefix: item-, required: true }
              - { label: "Nome", name: name, widget: string }
              - { label: "Categoria", name: category, widget: select, options: [
                  { label: Hambúrgueres, value: hamburgueres },
                  { label: Combos, value: combos },
                  { label: Porções, value: porcoes },
                  { label: Bebidas, value: bebidas },
                  { label: Sobremesas, value: sobremesas } ] }
              - { label: "Preço (R$)", name: price, widget: number, value_type: float, min: 0, step: 0.1 }
              - { label: "Descrição", name: description, widget: text, hint: "Nos combos, separe os itens com ' + ' (ex.: 1 hambúrguer + 1 batata + 1 refrigerante)." }
              - { label: "Foto", name: image, widget: image, required: false, hint: "Prefira imagens .webp de até 200 KB. Sem foto, o card usa um bloco da marca." }
              - { label: "Descrição da foto (acessibilidade)", name: imageAlt, widget: string, required: false }
              - { label: "Selo (ex.: Mais pedido, Novo)", name: badge, widget: string, required: false }
              - { label: "Aparece em destaque no topo do site (máximo 3)", name: featured, widget: boolean, default: false, required: false }
              - { label: "Enquadramento da foto (avançado)", name: imagePosition, widget: string, required: false, hint: "Deixe em branco, salvo orientação técnica." }

  - name: restaurante
    label: Restaurante
    delete: false
    editor:
      preview: false
    files:
      - name: informacoes
        label: Contato, endereço e horários
        file: brasa-burger/src/content/info.json
        fields:
          - label: Marca
            name: brand
            widget: object
            fields:
              - { label: "Nome da hamburgueria", name: name, widget: string }
              - { label: "Frase da marca", name: tagline, widget: string }
              - { label: "Segmento", name: segment, widget: string }
              - { label: "Site demonstrativo (mostra avisos de dados fictícios)", name: demo, widget: boolean }
              - { label: "Aviso de demonstração", name: demoNote, widget: string }
          - label: Contato
            name: contact
            widget: object
            fields:
              - { label: "WhatsApp (só números, com 55 + DDD)", name: whatsapp, widget: string, pattern: ['^[0-9]{12,13}$', "Use só números: 55 + DDD + número."] }
              - { label: "WhatsApp (como aparece no site)", name: whatsappDisplay, widget: string }
              - { label: "Telefone (como aparece no site)", name: phone, widget: string }
              - { label: "Telefone (para ligar, ex.: +551130000000)", name: phoneTel, widget: string }
              - { label: "Instagram (@usuário)", name: instagramHandle, widget: string }
              - { label: "Link do Instagram", name: instagramUrl, widget: string }
              - { label: "Mensagem inicial do WhatsApp", name: greeting, widget: string }
          - label: Endereço
            name: address
            widget: object
            fields:
              - { label: "Rua e número", name: street, widget: string }
              - { label: "Bairro", name: district, widget: string }
              - { label: "Cidade", name: city, widget: string }
              - { label: "Estado (sigla)", name: state, widget: string }
              - { label: "CEP", name: postalCode, widget: string }
              - { label: "Link do Como chegar (opcional)", name: directionsUrl, widget: string, required: false }
              - { label: "Link de incorporação do Google Maps (opcional)", name: mapEmbedSrc, widget: string, required: false }
          - label: Horário de funcionamento
            label_singular: Linha de horário
            name: hours
            widget: list
            summary: "{{fields.label}}: {{fields.time}}"
            fields:
              - { label: "Dias (como aparece no site)", name: label, widget: string }
              - { label: "Horário (ex.: 18h às 23h30, ou Fechado)", name: time, widget: string }
              - { label: "Dias da semana abertos (para o Google)", name: days, widget: select, multiple: true, required: false, options: [
                  { label: Segunda, value: Monday }, { label: Terça, value: Tuesday }, { label: Quarta, value: Wednesday },
                  { label: Quinta, value: Thursday }, { label: Sexta, value: Friday }, { label: Sábado, value: Saturday },
                  { label: Domingo, value: Sunday } ] }
              - { label: "Abre (ex.: 18:00)", name: opens, widget: string, required: false }
              - { label: "Fecha (ex.: 23:30)", name: closes, widget: string, required: false }
          - { label: "Formas de pagamento", name: payments, widget: list, field: { label: "Forma", name: forma, widget: string } }
          - label: Pedido
            name: order
            widget: object
            fields:
              - { label: "Aviso sobre a entrega", name: deliveryNote, widget: string }
              - { label: "Aviso depois de enviar o pedido", name: sentNotice, widget: text }

  - name: textos
    label: Textos do site
    delete: false
    editor:
      preview: false
    files:
      - name: textos-site
        label: Títulos e textos das seções
        file: brasa-burger/src/content/texts.json
        fields:
          - label: Topo da página
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "Chamada pequena", name: kicker, widget: string }
              - { label: "Título principal", name: title, widget: string }
              - { label: "Palavras em destaque (amarelo)", name: highlight, widget: string, required: false }
              - { label: "Subtítulo", name: subtitle, widget: text }
              - { label: "Botão principal", name: primary, widget: string }
              - { label: "Botão do WhatsApp", name: secondary, widget: string }
          - label: Destaques (3 hambúrgueres)
            name: highlights
            widget: object
            collapsed: true
            fields: [ { label: "Título", name: title, widget: string }, { label: "Subtítulo", name: subtitle, widget: text } ]
          - label: Cardápio completo
            name: menu
            widget: object
            collapsed: true
            fields: [ { label: "Título", name: title, widget: string }, { label: "Subtítulo", name: subtitle, widget: text } ]
          - label: Experiência e diferenciais
            name: experience
            widget: object
            collapsed: true
            fields: [ { label: "Título", name: title, widget: string }, { label: "Subtítulo", name: subtitle, widget: text } ]
          - label: Combos
            name: combos
            widget: object
            collapsed: true
            fields: [ { label: "Título", name: title, widget: string }, { label: "Subtítulo", name: subtitle, widget: text } ]
          - label: Nossa história
            name: story
            widget: object
            collapsed: true
            fields:
              - { label: "Chamada pequena", name: kicker, widget: string }
              - { label: "Título", name: title, widget: string }
              - { label: "Texto da história", name: text, widget: text }
              - { label: "Botão", name: cta, widget: string }
          - label: Instagram
            name: instagram
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: subtitle, widget: string }
              - { label: "Botão", name: cta, widget: string }
          - label: Localização e contato
            name: contact
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: subtitle, widget: string }
              - { label: "Botão Como chegar", name: cta, widget: string }
          - label: Chamada final
            name: finalCta
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: subtitle, widget: string }
              - { label: "Botão", name: cta, widget: string }
          - { label: "Texto de apresentação (rodapé e buscadores)", name: seoIntro, widget: text }
